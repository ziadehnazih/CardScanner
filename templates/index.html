<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Scanner MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white p-6 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        <h1 class="text-2xl font-bold text-center text-green-400">Card Value Scanner</h1>
        
        <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-center shadow-lg">
            <video id="video" autoplay playsinline class="w-full h-60 object-cover rounded-lg bg-black"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <button id="snap" class="mt-3 bg-green-500 hover:bg-green-600 text-gray-950 font-bold px-4 py-3 rounded-full w-full transition-all">
                📸 Take Picture & Scan
            </button>
        </div>

        <div id="results" class="hidden bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
            <div class="flex items-center space-x-3">
                <img id="card-img" class="w-20 h-28 object-cover rounded border border-gray-700" alt="Card" />
                <div>
                    <h2 id="card-name" class="font-bold text-lg text-white"></h2>
                    <p id="card-set" class="text-sm text-gray-400"></p>
                    <div class="mt-2 inline-block bg-green-950 text-green-300 px-2.5 py-0.5 rounded text-sm font-semibold border border-green-800">
                        Raw: $<span id="raw-price"></span>
                    </div>
                </div>
            </div>
            <div class="border-t border-gray-800 pt-3">
                <p class="text-xs text-gray-400 mb-2 font-semibold tracking-wider">ESTIMATED GRADED VALUES</p>
                <div id="graded-grid" class="grid grid-cols-2 gap-2 text-center"></div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Camera access denied or unavailable."); });

        document.getElementById('snap').addEventListener('click', async () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: canvas.toDataURL('image/jpeg') })
                });
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('results').classList.remove('hidden');
                    document.getElementById('card-img').src = data.image_url;
                    document.getElementById('card-name').innerText = data.name;
                    document.getElementById('card-set').innerText = `${data.set} #${data.number}`;
                    document.getElementById('raw-price').innerText = data.raw_price.toFixed(2);
                    
                    const grid = document.getElementById('graded-grid');
                    grid.innerHTML = '';
                    for (const [grade, price] of Object.entries(data.graded_prices)) {
                        grid.innerHTML += `
                            <div class="bg-gray-800/60 p-2 rounded border border-gray-700">
                                <div class="text-xs text-gray-400 font-bold">${grade}</div>
                                <div class="text-green-400 font-bold">$${price.toFixed(2)}</div>
                            </div>
                        `;
                    }
                }
            } catch (e) {
                console.error(e);
                alert("Error connecting to server.");
            }
        });
    </script>
</body>
</html>
